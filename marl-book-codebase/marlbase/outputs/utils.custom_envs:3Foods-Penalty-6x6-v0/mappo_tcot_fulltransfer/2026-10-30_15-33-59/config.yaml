seed: 1
algorithm:
  total_steps: 2000000
  log_interval: 10000
  save_interval: 400000
  eval_interval: 40000
  eval_episodes: 100
  video_interval: 40000
  video_frames: 200
  _target_: decomp_ac.train_fulltransfer.main
  name: mappo_tcot_fulltransfer
  model:
    _target_: decomp_ac.model_tcot_fulltransfer.TransformerCriticOTMAPPONetwork
    actor:
      parameter_sharing: true
      use_orthogonal_init: true
      use_rnn: false
    critic:
      centralised: true
    device: cuda
  critic_d_model: 128
  critic_n_heads: 4
  critic_d_ffn: 256
  optimism_alpha: 0.1
  ppo_epochs: 4
  num_mini_batches: 2
  clip_param: 0.2
  gae_lambda: 0.95
  use_clipped_value_loss: true
  optimizer: Adam
  lr: 0.0003
  grad_clip: 0.5
  gamma: 0.99
  entropy_coef: 0.01
  value_loss_coef: 0.5
  use_proper_termination: false
  standardise_returns: true
  target_update_interval_or_tau: 200
env:
  _target_: utils.envs.make_env
  name: utils.custom_envs:3Foods-Penalty-6x6-v0
  time_limit: 50
  clear_info: false
  observe_id: false
  standardise_rewards: false
  wrappers: null
  parallel_envs: 16
logger:
  _target_: utils.loggers.FileSystemLogger
  project_name: fastmarl
