# @package _global_
env:
  # In MAPPO, having slightly more parallel environments (e.g., 10 to 16) 
  # provides richer mini-batch diversity.
  parallel_envs: 16

algorithm:
  _target_: decomp_ac.train.main
  name: "decomp_optimappo"

  model:
    _target_: decomp_ac.model_opti_know.DecompOptiMAPPONetwork
    actor:
      layers:
        - 128
        - 128
      parameter_sharing: False
      use_orthogonal_init: True
      use_rnn: False
    critic:
      centralised: True        # True for Centralised Training (CTDE)
      layers:
        - 128
        - 128
      parameter_sharing: False  # False ensures N x M independent networks
      use_orthogonal_init: True
      use_rnn: False

    device: "cuda"             # Set to "cpu" if running without a GPU

  # -------------------------------------------------------------
  # Decomposed Channels & Targeted Optimism Settings
  # -------------------------------------------------------------
  n_reward_channels: 4
  coop_channel_idx: 0          # Channel 0 is ID_1 (Coop Food)
  optimism_alpha: 0.1          # Negative slope for LeakyReLU on coop advantage (0.1 = 90% discount on miscoordination)
  channel_weights: [1.0, 1.0, 1.0, 1.0]

  # -------------------------------------------------------------
  # PPO Core Hyperparameters
  # -------------------------------------------------------------
  ppo_epochs: 4               # (was 10) Number of optimization epochs per rollout batch
  # num_mini_batches: 2          # Slices parallel envs into sub-batches (e.g., 10 envs -> 2 batches of 5 envs)
  clip_param: 0.2              # PPO surrogate clipping epsilon (1 +/- eps)
  gae_lambda: 0.95             # Generalized Advantage Estimation lambda
  use_clipped_value_loss: True # Standard MAPPO value clipping to prevent critic instability

  # -------------------------------------------------------------
  # Optimization & Trajectory Rollout
  # -------------------------------------------------------------
  optimizer: "Adam"
  lr: 3.e-4
  grad_clip: 0.5               # Gradient norm clipping
  
  # For Level-Based Foraging (25-50 steps/episode), MAPPO benefits from
  # unrolling full or half episodes (25-50 steps) rather than short 5-step chunks.
  n_steps: 25                  # Increased from 5 to allow multi-channel GAE to propagate temporal credit
  gamma: 0.99
  entropy_coef: 0.01
  value_loss_coef: 0.5
  use_proper_termination: False

  # In MAPPO, standardizing returns via RunningMeanStd is crucial
  # to keep GAE values in line with the clip parameter (0.2).
  standardise_returns: True    # Strongly recommended for PPO stability

  target_update_interval_or_tau: 200

  # -------------------------------------------------------------
  # Evaluation & Logging
  # -------------------------------------------------------------
  total_steps: 2000000
  eval_interval: 40000
  save_interval: 0
  video_interval: 0
  video_frames: 200