# @package _global_
env:
  parallel_envs: 16

algorithm:
  _target_: decomp_ac.train_fulltransfer.main
  name: "mappo_tcot_fulltransfer"

  model:
    _target_: decomp_ac.model_tcot_fulltransfer.TransformerCriticOTMAPPONetwork
    actor:
      parameter_sharing: True                   # Recommended for LBF (faster coordination)
      use_orthogonal_init: True
      use_rnn: False
    critic:
      centralised: True

    device: "cuda"

  # -------------------------------------------------------------
  # Relational Transformer Critic & Actor Dimensions
  # -------------------------------------------------------------
  critic_d_model: 128          # Latent dimension for entity tokens and channel queries
  critic_n_heads: 4            # Number of attention heads (divides 128 evenly)
  critic_d_ffn: 256            # Hidden dimension of the FiLM FFN block

  # -------------------------------------------------------------
  # Autonomous Targeted Coordination Optimism
  # -------------------------------------------------------------
  optimism_alpha: 0.1          # Discount factor for negative cooperative updates (90% softening)

  # -------------------------------------------------------------
  # PPO Core Hyperparameters
  # -------------------------------------------------------------
  ppo_epochs: 4                # Number of optimization epochs per rollout batch
  num_mini_batches: 2          # Splits 800-step rollout into two 400-step mini-batches
  clip_param: 0.2              # PPO surrogate clipping epsilon
  gae_lambda: 0.95             # Multi-Channel GAE lambda
  use_clipped_value_loss: True # Multi-Channel value clipping

  # -------------------------------------------------------------
  # Optimization
  # -------------------------------------------------------------
  optimizer: "Adam"
  lr: 3.e-4
  grad_clip: 0.5
  gamma: 0.99
  entropy_coef: 0.01
  value_loss_coef: 0.5
  use_proper_termination: False

  # Multi-channel return standardization
  standardise_returns: True

  # Target Critic Update: hard update every 200 steps
  target_update_interval_or_tau: 200

  # -------------------------------------------------------------
  # Evaluation & Logging
  # -------------------------------------------------------------
  total_steps: 2000000
  eval_interval: 40000
  save_interval: 400000        
  video_interval: 400000
  video_frames: 200