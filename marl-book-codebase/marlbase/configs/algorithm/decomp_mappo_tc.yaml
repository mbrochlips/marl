# @package _global_
env:
  # In MAPPO, having slightly more parallel environments (e.g., 10 to 16) 
  # provides richer mini-batch diversity.
  parallel_envs: 16

algorithm:
  _target_: decomp_ac.train.main
  name: "mappo_tc"

  model:
    _target_: decomp_ac.model_tc.TransformerCriticMAPPONetwork
    actor:
      layers:
        - 128
        - 128
      parameter_sharing: False
      use_orthogonal_init: True
      use_rnn: False
    critic:
      centralised: True        # True for Centralised Training with Decentralized Execution (CTDE)
      # Note: 'layers', 'parameter_sharing', and 'use_rnn' are removed here because 
      # the single ChannelQueryTransformerCritic inherently handles all agents and channels.

    device: "cuda"             # Set to "cpu" if running without a GPU

  # -------------------------------------------------------------
  # Channel-Query Transformer Critic Settings
  # -------------------------------------------------------------
  critic_d_model: 128          # Latent dimension for state tokens, channel queries, and cross-attention
  critic_n_heads: 4            # Number of attention heads (must divide critic_d_model evenly)
  critic_d_ffn: 256            # Hidden dimension of the channel-modulated FiLM FFN
  n_state_tokens: 4            # Number of tokens the centralized state is projected into

  # -------------------------------------------------------------
  # Decomposed Channels & Autonomous Targeted Optimism
  # -------------------------------------------------------------
  n_reward_channels: 4
  channel_weights: [1.0, 1.0, 1.0, 1.0]
  # Note: Manual 'coop_channel_idx' is no longer required as CoordinationDetector 
  # identifies coordination channels online via supermodular surplus.

  # -------------------------------------------------------------
  # PPO Core Hyperparameters
  # -------------------------------------------------------------
  ppo_epochs: 4                # Number of optimization epochs per rollout batch
  # num_mini_batches: 2        # Slices parallel envs into sub-batches (uncomment if GPU memory is constrained)
  clip_param: 0.2              # PPO surrogate clipping epsilon (1 +/- eps)
  gae_lambda: 0.95             # Generalized Advantage Estimation lambda
  use_clipped_value_loss: True # Standard MAPPO value clipping to prevent critic instability

  # -------------------------------------------------------------
  # Optimization & Trajectory Rollout
  # -------------------------------------------------------------
  optimizer: "Adam"
  lr: 3.e-4
  grad_clip: 0.5               # Gradient norm clipping
  
  # For Level-Based Foraging (25-50 steps/episode), MAPPO benefits from
  # unrolling full or half episodes (25-50 steps) rather than short chunks.
  n_steps: 25                  # Allows multi-channel GAE to propagate temporal credit properly
  gamma: 0.99
  entropy_coef: 0.01
  value_loss_coef: 0.5
  use_proper_termination: False

  # Standardizing returns via RunningMeanStd keeps multi-channel GAE values balanced
  standardise_returns: True    # Strongly recommended for multi-channel stability

  # Target Critic Update:
  # Values >= 1.0 trigger hard updates every N steps (e.g., 200).
  # Values < 1.0 trigger Polyak soft updates every step (e.g., 0.01).
  target_update_interval_or_tau: 200

  # -------------------------------------------------------------
  # Evaluation & Logging
  # -------------------------------------------------------------
  total_steps: 2000000
  eval_interval: 40000
  save_interval: 0
  video_interval: 0
  video_frames: 200